<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陕西文旅 - 分享二维码生成</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.gradient-bg {
    background: linear-gradient(135deg, #C04851 0%, #D4AF37 100%);
}
.card-shadow { box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
.qr-container { 
    background: white; padding: 20px; border-radius: 16px; 
    display: inline-block;
}
</style>
</head>
<body class="min-h-screen gradient-bg flex items-center justify-center p-4">

<div class="bg-white rounded-3xl card-shadow max-w-md w-full overflow-hidden">
    
    <!-- 头部 -->
    <div class="gradient-bg text-white text-center py-6 px-4">
        <div class="text-4xl mb-2">🏔️</div>
        <h1 class="text-xl font-bold">陕西文旅导航</h1>
        <p class="text-sm text-white/80 mt-1">扫码即可访问 · 永久免费在线</p>
    </div>

    <!-- 输入区 -->
    <div class="p-6 space-y-5">
        
        <!-- URL输入 -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
                📎 粘贴你的网站链接
            </label>
            <input type="text" id="urlInput" 
                value="https://你的用户名.github.io/shaanxi-tour/"
                placeholder="粘贴GitHub Pages链接..."
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-red-400 focus:outline-none transition-all text-center text-gray-600"
            >
            <p id="urlHint" class="text-xs text-orange-500 mt-2 hidden">
                ⚠️ 请替换为你的真实链接（部署完成后自动填充）
            </p>
        </div>

        <!-- 生成按钮 -->
        <button onclick="generateQR()" 
            class="w-full bg-gradient-to-r from-red-600 to-orange-500 text-white py-3 rounded-xl font-bold shadow-lg hover:shadow-xl active:scale-95 transition-all text-lg">
            ✨ 生成二维码
        </button>

        <!-- 二维码展示 -->
        <div class="flex justify-center mt-4">
            <div id="qrCode" class="qr-container"></div>
        </div>

        <!-- 提示文字 -->
        <div id="qrTip" class="text-center text-sm text-gray-500 hidden">
            <p>👆 长按保存图片，发到微信/QQ/朋友圈</p>
        </div>

    </div>

    <!-- 底部说明 -->
    <div class="bg-gray-50 px-6 py-5 border-t border-gray-100">
        <h3 class="font-bold text-gray-800 mb-3 text-sm">📋 使用步骤：</h3>
        <ol class="text-xs text-gray-600 space-y-2">
            <li><span class="inline-block w-5 h-5 bg-red-500 text-white rounded-full text-center leading-5 mr-1 text-[10px]">1</span> 注册 GitHub → 创建仓库</li>
            <li><span class="inline-block w-5 h-5 bg-red-500 text-white rounded-full text-center leading-5 mr-1 text-[10px]">2</span> 上传所有网页文件到仓库</li>
            <li><span class="inline-block w-5 h-5 bg-red-500 text-white rounded-full text-center leading-5 mr-1 text-[10px]">3</span> 开启 Settings → Pages</li>
            <li><span class="inline-block w-5 h-5 bg-red-500 text-white rounded-full text-center leading-5 mr-1 text-[10px]">4</span> 把生成的链接粘贴到这里 → 生成二维码</li>
        </ol>
        <a href="./部署指南-GitHub-Pages.md" target="_blank" 
           class="mt-3 inline-block text-xs text-blue-500 hover:text-blue-700 underline">
            👉 查看详细图文教程 →
        </a>
    </div>

</div>

<script>
// 页面加载时尝试读取剪贴板中的URL
window.onload = function() {
    // 检查URL参数
    const urlParams = new URLSearchParams(window.location.search);
    const prefillUrl = urlParams.get('url');
    if (prefillUrl) {
        document.getElementById('urlInput').value = prefillUrl;
        generateQR();
    }
};

function generateQR() {
    const url = document.getElementById('urlInput').value.trim();
    const container = document.getElementById('qrCode');
    const tip = document.getElementById('qrTip');
    
    if (!url || url.includes('你的用户名')) {
        container.innerHTML = '';
        tip.classList.add('hidden');
        document.getElementById('urlHint').classList.remove('hidden');
        return;
    }
    
    document.getElementById('urlHint').classList.add('hidden');
    container.innerHTML = '';
    
    new QRCode(container, {
        text: url,
        width: 200,
        height: 200,
        colorDark: '#C04851',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
    });
    
    tip.classList.remove('hidden');
}

// 回车键触发
document.getElementById('urlInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') generateQR();
});
</script>

</body>
</html>
