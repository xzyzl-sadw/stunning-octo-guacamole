<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册 - 数智轻行 智游三秦</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#667eea',
                        secondary: '#764ba2',
                        accent: '#f093fb'
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        html { font-size: 18px; }
        * {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .nav-glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-style {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-size: 1rem;
            background: white;
        }
        .input-style:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .tab-active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.05);
        }
        .tab-inactive {
            background: #f3f4f6;
            color: #6b7280;
        }
        .tab-btn {
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .form-panel {
            display: none;
            animation: fadeSlideIn 0.4s ease forwards;
        }
        .form-panel.active {
            display: block;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .floating { animation: float 3s ease-in-out infinite; }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }
        .btn-primary:hover::before {
            width: 400px; height: 400px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: 2px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #6b7280;
        }
        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        .social-btn.wechat:hover { border-color: #07c160; color: #07c160; }
        .social-btn.qq:hover { border-color: #1296db; color: #1296db; }
        .social-btn.weibo:hover { border-color: #e6162d; color: #e6162d; }

        .checkbox-custom {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .checkbox-custom:checked {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3E%3C/svg%3E");
            background-size: 14px;
            background-position: center;
            background-repeat: no-repeat;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }
        .password-toggle:hover { color: #667eea; }
    </style>
</head>
<body class="min-h-screen" style="background: url('img/陕西.jpg') center center / cover fixed no-repeat;">
    <!-- 顶部彩条 -->
    <div class="h-1 bg-gradient-to-r from-purple-500 via-pink-500 to-orange-500"></div>

    <!-- 导航栏 -->
    <header class="nav-glass sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="about.html" class="flex items-center gap-3 group">
                    <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-500 rounded-xl flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-compass text-white text-xl"></i>
                    </div>
                    <div>
                        <div class="font-bold text-gray-800 text-lg">数智轻行 智游三秦</div>
                        <div class="text-xs text-gray-500">轻量 · 便捷 · 精准</div>
                    </div>
                </a>
                <nav class="hidden md:flex items-center gap-8">
                    <a href="about.html" class="text-sm text-gray-600 hover:text-purple-600 transition-colors font-medium">关于陕西</a>
                    <a href="culture.html" class="text-sm text-gray-600 hover:text-purple-600 transition-colors font-medium">文化特色</a>
                    <a href="attractions.html" class="text-sm text-gray-600 hover:text-purple-600 transition-colors font-medium">景点介绍</a>
                    <a href="food.html" class="text-sm text-gray-600 hover:text-purple-600 transition-colors font-medium">美食推荐</a>
                    <a href="guide.html" class="text-sm text-gray-600 hover:text-purple-600 transition-colors font-medium">旅游指南</a>
                    <a href="contact.html" class="text-sm text-gray-600 hover:text-purple-600 transition-colors font-medium">联系我们</a>
                    <span class="px-5 py-2.5 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-full text-sm font-bold">账号中心</span>
                </nav>
                <button class="md:hidden text-gray-600"><i class="fa-solid fa-bars text-2xl"></i></button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="min-h-[calc(100vh-80px)] flex items-center justify-center py-12 px-4 relative">
        <!-- 装饰元素 -->
        <div class="absolute top-20 left-10 w-24 h-24 bg-purple-200/30 rounded-full blur-2xl"></div>
        <div class="absolute bottom-20 right-10 w-32 h-32 bg-pink-200/30 rounded-full blur-2xl"></div>

        <div class="glass-card rounded-3xl p-8 md:p-12 w-full max-w-[480px] relative z-10">
            <!-- Logo区域 -->
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-purple-500 via-pink-500 to-orange-500 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-xl floating">
                    <i class="fa-solid fa-user-lock text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold gradient-text mb-2">欢迎来到智游三秦</h1>
                <p class="text-gray-500 text-sm">登录或注册，开启您的陕西之旅</p>
            </div>

            <!-- 切换标签 -->
            <div class="flex rounded-2xl p-1.5 bg-gray-100 mb-8">
                <button id="loginTab" class="tab-btn tab-active flex-1 py-3 rounded-xl font-bold text-sm" onclick="switchTab('login')">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i>登录
                </button>
                <button id="registerTab" class="tab-btn tab-inactive flex-1 py-3 rounded-xl font-bold text-sm" onclick="switchTab('register')">
                    <i class="fa-solid fa-user-plus mr-2"></i>注册
                </button>
            </div>

            <!-- 登录表单 -->
            <div id="loginForm" class="form-panel active">
                <form onsubmit="handleLogin(event)">
                    <div class="space-y-4 mb-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2 ml-1">
                                <i class="fa-solid fa-envelope mr-1 text-purple-500"></i>邮箱 / 手机号
                            </label>
                            <input type="text" class="input-style" placeholder="请输入邮箱或手机号" required />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2 ml-1">
                                <i class="fa-solid fa-lock mr-1 text-purple-500"></i>密码
                            </label>
                            <div class="relative">
                                <input type="password" id="loginPwd" class="input-style pr-11" placeholder="请输入密码" required />
                                <span class="password-toggle" onclick="togglePassword('loginPwd', this)"><i class="fa-regular fa-eye"></i></span>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mb-6 pl-1">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" class="checkbox-custom" checked />
                            <span class="text-xs text-gray-500 group-hover:text-purple-600 transition-colors">记住我</span>
                        </label>
                        <a href="#" class="text-xs text-purple-600 hover:text-purple-800 font-medium transition-colors">忘记密码？</a>
                    </div>

                    <button type="submit" class="btn-primary w-full mb-6">
                        <i class="fa-solid fa-right-to-bracket mr-2"></i>登 录
                    </button>

                    <div class="relative mb-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200"></div>
                        </div>
                        <div class="relative flex justify-center text-xs"><span class="bg-white px-4 text-gray-400">其他登录方式</span></div>
                    </div>

                    <div class="flex justify-center gap-4">
                        <button type="button" class="social-btn wechat" title="微信登录"><i class="fa-brands fa-weixin text-xl"></i></button>
                        <button type="button" class="social-btn qq" title="QQ登录"><i class="fa-brands fa-qq text-xl"></i></button>
                        <button type="button" class="social-btn weibo" title="微博登录"><i class="fa-brands fa-weibo text-xl"></i></button>
                    </div>
                </form>
            </div>

            <!-- 注册表单 -->
            <div id="registerForm" class="form-panel">
                <form onsubmit="handleRegister(event)">
                    <div class="space-y-4 mb-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2 ml-1">
                                <i class="fa-solid fa-user mr-1 text-pink-500"></i>用户名
                            </label>
                            <input type="text" class="input-style" placeholder="设置您的用户名（2-16位）" required minlength="2" maxlength="16" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2 ml-1">
                                <i class="fa-solid fa-envelope mr-1 text-pink-500"></i>邮箱 / 手机号
                            </label>
                            <input type="text" class="input-style" placeholder="用于接收通知和找回密码" required />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2 ml-1">
                                <i class="fa-solid fa-lock mr-1 text-pink-500"></i>密码
                            </label>
                            <div class="relative">
                                <input type="password" id="regPwd" class="input-style pr-11" placeholder="至少8位，包含字母和数字" required minlength="8" />
                                <span class="password-toggle" onclick="togglePassword('regPwd', this)"><i class="fa-regular fa-eye"></i></span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2 ml-1">
                                <i class="fa-solid fa-key mr-1 text-pink-500"></i>确认密码
                            </label>
                            <div class="relative">
                                <input type="password" id="confirmPwd" class="input-style pr-11" placeholder="再次输入密码" required />
                                <span class="password-toggle" onclick="togglePassword('confirmPwd', this)"><i class="fa-regular fa-eye"></i></span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-6 pl-1">
                        <label class="flex items-start gap-2 cursor-pointer group">
                            <input type="checkbox" class="checkbox-custom mt-0.5" required />
                            <span class="text-xs text-gray-500 group-hover:text-purple-600 transition-colors leading-relaxed">
                                我已阅读并同意 <a href="#" class="text-purple-600 hover:underline font-medium">《用户协议》</a> 和 <a href="#" class="text-purple-600 hover:underline font-medium">《隐私政策》</a>
                            </span>
                        </label>
                    </div>

                    <button type="submit" class="btn-primary w-full mb-6" style="background: linear-gradient(135deg, #ec4899 0%, #f97316 100%);">
                        <i class="fa-solid fa-user-plus mr-2"></i>注 册
                    </button>

                    <div class="relative mb-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200"></div>
                        </div>
                        <div class="relative flex justify-center text-xs"><span class="bg-white px-4 text-gray-400">其他注册方式</span></div>
                    </div>

                    <div class="flex justify-center gap-4">
                        <button type="button" class="social-btn wechat" title="微信注册"><i class="fa-brands fa-weixin text-xl"></i></button>
                        <button type="button" class="social-btn qq" title="QQ注册"><i class="fa-brands fa-qq text-xl"></i></button>
                        <button type="button" class="social-btn weibo" title="微博注册"><i class="fa-brands fa-weibo text-xl"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- 底部彩条 -->
    <div class="h-1 bg-gradient-to-r from-purple-500 via-pink-500 to-orange-500 fixed bottom-0 left-0 right-0 z-50"></div>

    <!-- 提示消息弹窗 -->
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-[9999] opacity-0 pointer-events-none transition-all duration-300 transform -translate-y-4">
        <div class="glass-card rounded-xl px-6 py-3 flex items-center gap-3 shadow-2xl">
            <i id="toastIcon" class="fa-solid fa-circle-check text-green-500 text-lg"></i>
            <span id="toastText" class="font-medium text-gray-800 text-sm"></span>
        </div>
    </div>

    <script>
        // 切换登录/注册标签
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginTab.classList.add('tab-active');
                loginTab.classList.remove('tab-inactive');
                registerTab.classList.add('tab-inactive');
                registerTab.classList.remove('tab-active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                registerTab.classList.add('tab-active');
                registerTab.classList.remove('tab-inactive');
                loginTab.classList.add('tab-inactive');
                loginTab.classList.remove('tab-active');
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
            }
        }

        // 显示/隐藏密码
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Toast提示
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastText = document.getElementById('toastText');

            toastIcon.className = isSuccess ? 'fa-solid fa-circle-check text-green-500 text-lg' : 'fa-solid fa-circle-xmark text-red-500 text-lg';
            toastText.textContent = message;

            toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        }

        // 登录处理
        function handleLogin(e) {
            e.preventDefault();
            showToast('登录成功！正在跳转...', true);
            setTimeout(() => window.location.href = 'about.html', 1500);
        }

        // 注册处理
        function handleRegister(e) {
            e.preventDefault();
            const pwd = document.querySelector('#registerForm input[type="password"][id="regPwd"]');
            const confirmPwd = document.querySelector('#registerForm input[type="password"][id="confirmPwd"]');
            if (pwd.value !== confirmPwd.value) {
                showToast('两次输入的密码不一致！', false);
                return;
            }
            if (pwd.value.length < 8 || !/[a-zA-Z]/.test(pwd.value) || !/\d/.test(pwd.value)) {
                showToast('密码至少8位且需包含字母和数字', false);
                return;
            }
            showToast('注册成功！即将跳转到首页...', true);
            setTimeout(() => window.location.href = 'about.html', 1500);
        }
    </script>
</body>
</html>
